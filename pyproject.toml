[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "pybind11>=2.12",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Skip 32-bit and PyPy targets for the first release; can broaden later.
skip = ["pp*", "*-win32", "*-manylinux_i686", "*-musllinux_i686"]

# Smoke-test every wheel after build to catch packaging / runtime bugs early.
# faulthandler makes any C-level segfault during the test print a Python
# stack trace before crashing, so we can identify the culprit test.
test-requires = "pytest"
test-command = "python -X faulthandler -m pytest -q {project}/tests"

[tool.cibuildwheel.linux]
# manylinux_2_34 (AlmaLinux 9 / glibc 2.34) - newer than 2_28 because
# libzpaq's JIT path crashes inside the 2_28 container on GH Actions
# runners (most likely a kernel/glibc-2.28 mmap or seccomp interaction).
manylinux-x86_64-image = "manylinux_2_34"
manylinux-aarch64-image = "manylinux_2_34"

[tool.cibuildwheel.macos]
# Build a fat wheel that covers both Intel and Apple Silicon.
archs = ["x86_64", "arm64"]
