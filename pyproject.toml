[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "pybind11>=2.12",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Skip 32-bit, PyPy, and cp38 (EOL'd Oct 2024 and not shipped in the newer
# manylinux_2_34 image we now use for the Linux wheels).
skip = ["pp*", "*-win32", "*-manylinux_i686", "*-musllinux_i686", "cp38-*"]

# Smoke-test every wheel after build to catch packaging / runtime bugs early.
# faulthandler makes any C-level segfault during the test print a Python
# stack trace before crashing, so we can identify the culprit test.
test-requires = "pytest"
test-command = "python -X faulthandler -m pytest -q {project}/tests"

[tool.cibuildwheel.linux]
# AlmaLinux 9 / glibc 2.34 (newer than the default manylinux_2_28
# AlmaLinux 8 image). The default older image crashed inside the libzpaq
# JIT-emitted code on GH Actions runners; the newer image fixes it.
# Full image reference required because cibuildwheel 2.21 only knows the
# short names up through manylinux_2_28.
manylinux-x86_64-image = "quay.io/pypa/manylinux_2_34_x86_64:latest"
manylinux-aarch64-image = "quay.io/pypa/manylinux_2_34_aarch64:latest"

[tool.cibuildwheel.macos]
# Build a fat wheel that covers both Intel and Apple Silicon.
archs = ["x86_64", "arm64"]
