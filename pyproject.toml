[build-system]
requires = [
    "setuptools>=64",
    "wheel",
    "pybind11>=2.12",
]
build-backend = "setuptools.build_meta"

[tool.cibuildwheel]
# Skip 32-bit and PyPy targets for the first release; can broaden later.
skip = ["pp*", "*-win32", "*-manylinux_i686", "*-musllinux_i686"]

# Smoke-test every wheel after build to catch packaging / runtime bugs early.
test-requires = "pytest"
test-command = "pytest -q {project}/tests"

[tool.cibuildwheel.linux]
# manylinux_2_28 gives broad glibc compatibility while still having a modern
# enough toolchain for C++14 without surprises.
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Build a fat wheel that covers both Intel and Apple Silicon.
archs = ["x86_64", "arm64"]
